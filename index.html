<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AEN PHSS Muara Badak — Earthwork Project Control</title>
<style>
:root{
  --baja:#22303c; --baja2:#2c3e4e; --baja3:#3b5265;
  --tanah:#b5721c; --tanah2:#8a530f; --tanah-mu:#f6ecd9;
  --latar:#e9ecee; --kertas:#ffffff; --garis:#cdd5db; --garis2:#e4e9ed;
  --teks:#17212b; --redup:#5d6c79;
  --hijau:#146b52; --hijau-mu:#e2f0eb;
  --merah:#a32020; --merah-mu:#f8e6e6;
  --kuning:#b8860b; --kuning-mu:#fbf1da;
  --biru:#1d4e79; --biru-mu:#e6eef5;
  --r:10px; --bayang:0 1px 2px rgba(23,33,43,.08),0 6px 18px rgba(23,33,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--latar); color:var(--teks); font-size:14px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.num,td.num,.tab td.num{font-variant-numeric:tabular-nums;text-align:right}
a{color:var(--biru)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px} h3{font-size:15px} h4{font-size:13px;color:var(--redup);font-weight:600}

/* ====== LOGIN ====== */
#login{position:fixed;inset:0;background:
   radial-gradient(120% 80% at 50% -10%, #33485b 0%, #22303c 55%, #1a242e 100%);
   display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;overflow:auto}
.kartu-login{width:100%;max-width:420px;background:var(--kertas);border-radius:16px;
   box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.login-atas{padding:22px 22px 14px;text-align:center;border-bottom:1px solid var(--garis2)}
.login-atas img.aen{width:190px;max-width:70%;display:block;margin:0 auto 10px}
.login-atas .judul{font-size:17px;font-weight:700;letter-spacing:-.01em}
.login-atas .sub{font-size:12.5px;color:var(--redup);margin-top:3px}
.login-badan{padding:18px 22px 22px}
.login-konsor{padding:12px 22px 16px;background:#f6f8f9;border-top:1px solid var(--garis2);text-align:center}
.login-konsor img{width:230px;max-width:85%;display:block;margin:0 auto 6px}
.login-konsor .ket{font-size:11px;color:var(--redup);letter-spacing:.02em}
#pinBox{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
#pinBox input{width:42px;height:52px;text-align:center;font-size:22px;font-weight:700;
  border:1.5px solid var(--garis);border-radius:10px;background:#fbfcfd}
#pinBox input:focus{outline:none;border-color:var(--tanah);box-shadow:0 0 0 3px var(--tanah-mu)}
.login-pesan{min-height:20px;font-size:13px;text-align:center;color:var(--merah)}

/* ====== SHELL ====== */
#app{display:none;min-height:100vh}
#sisi{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--baja);color:#dfe6eb;
  display:flex;flex-direction:column;z-index:40}
.sisi-kop{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.09);background:#fff}
.sisi-kop img{width:100%;max-width:150px;display:block;margin:0 auto}
.sisi-proyek{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.sisi-proyek .nm{font-size:12.5px;font-weight:600;color:#fff;line-height:1.3}
.sisi-proyek .lk{font-size:11px;color:#9fb2c0;margin-top:2px}
#menu{flex:1;overflow:auto;padding:8px 0 14px}
.menu-grup{padding:12px 16px 5px;font-size:10.5px;letter-spacing:.09em;color:#7b92a3;text-transform:uppercase}
.menu-item{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 13px;cursor:pointer;
  border-left:3px solid transparent;color:#cdd9e1;font-size:13.5px}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff}
.menu-item.aktif{background:rgba(181,114,28,.18);border-left-color:var(--tanah);color:#fff;font-weight:600}
.menu-item .ik{width:18px;text-align:center;opacity:.9;font-size:14px}
.menu-item .lonceng{margin-left:auto;background:var(--merah);color:#fff;border-radius:9px;
  padding:0 6px;font-size:10.5px;font-weight:700}
.sisi-kaki{padding:10px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8ea3b2}

#utama{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
#bar{position:sticky;top:0;background:var(--kertas);border-bottom:1px solid var(--garis);
  padding:9px 18px;display:flex;align-items:center;gap:12px;z-index:30}
#bar .tombol-menu{display:none}
#bar .judul-hal{font-size:16px;font-weight:700;letter-spacing:-.01em}
#bar .kanan{margin-left:auto;display:flex;align-items:center;gap:10px}
#bar img.konsor{height:26px;opacity:.95}
.chip-user{display:flex;align-items:center;gap:7px;background:#f3f6f8;border:1px solid var(--garis2);
  border-radius:20px;padding:3px 10px 3px 4px;cursor:pointer}
.chip-user .av{width:24px;height:24px;border-radius:50%;background:var(--baja3);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chip-user .nm{font-size:12.5px;font-weight:600;line-height:1.1}
.chip-user .pr{font-size:10.5px;color:var(--redup);line-height:1.1}
.chip-sync{display:flex;align-items:center;gap:6px;border-radius:20px;padding:4px 11px;font-size:12px;
  font-weight:600;cursor:pointer;border:1px solid transparent}
.chip-sync.off{background:#eef1f3;color:#5d6c79;border-color:var(--garis)}
.chip-sync.ok{background:var(--hijau-mu);color:var(--hijau)}
.chip-sync.tunggu{background:var(--kuning-mu);color:var(--kuning)}
.chip-sync.gagal{background:var(--merah-mu);color:var(--merah)}
#isi{flex:1;padding:18px;max-width:1400px;width:100%}
#isi::after{content:"";display:block;height:40px}

/* watermark avindo */
#utama{position:relative}
#cap-air{position:fixed;right:26px;bottom:18px;width:132px;opacity:.07;pointer-events:none;z-index:0}

/* ====== KOMPONEN ====== */
.kartu{background:var(--kertas);border:1px solid var(--garis);border-radius:var(--r);
  box-shadow:var(--bayang);margin-bottom:16px;position:relative;z-index:1}
.kartu-kop{padding:12px 16px;border-bottom:1px solid var(--garis2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kartu-kop .kanan{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kartu-isi{padding:16px}
.kartu-isi.rapat{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

.kpi{background:var(--kertas);border:1px solid var(--garis);border-radius:var(--r);padding:13px 15px;
  box-shadow:var(--bayang);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tanah)}
.kpi.hijau:before{background:var(--hijau)} .kpi.merah:before{background:var(--merah)}
.kpi.biru:before{background:var(--biru)} .kpi.kuning:before{background:var(--kuning)}
.kpi .lab{font-size:11.5px;color:var(--redup);font-weight:600}
.kpi .nil{font-size:25px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .ket{font-size:11.5px;color:var(--redup);margin-top:2px}

.bar-progres{height:9px;background:#e7ebee;border-radius:6px;overflow:hidden;margin-top:8px}
.bar-progres i{display:block;height:100%;background:linear-gradient(90deg,var(--tanah),var(--tanah2));border-radius:6px}

table.tab{width:100%;border-collapse:collapse;font-size:13px}
table.tab th{background:#f4f7f9;text-align:left;padding:8px 10px;font-size:11.5px;color:#44535f;
  font-weight:700;border-bottom:1px solid var(--garis);white-space:nowrap;position:sticky;top:0;z-index:2}
table.tab td{padding:7px 10px;border-bottom:1px solid var(--garis2);vertical-align:top}
table.tab tr:hover td{background:#fafcfd}
.gulir{overflow:auto;max-height:62vh;border-radius:0 0 var(--r) var(--r)}
.kosong{padding:26px 16px;text-align:center;color:var(--redup)}
.kosong b{display:block;color:var(--teks);font-size:14px;margin-bottom:3px}

.tbl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--garis);background:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--teks)}
.tbl:hover{background:#f5f8fa}
.tbl.utama{background:var(--tanah);border-color:var(--tanah);color:#fff}
.tbl.utama:hover{background:var(--tanah2)}
.tbl.gelap{background:var(--baja);border-color:var(--baja);color:#fff}
.tbl.gelap:hover{background:var(--baja2)}
.tbl.bahaya{color:var(--merah);border-color:#e4bcbc}
.tbl.kecil{padding:4px 9px;font-size:12px;border-radius:7px}
.tbl:disabled{opacity:.5;cursor:not-allowed}

.st{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em}
.st.OPERASI{background:var(--hijau-mu);color:var(--hijau)}
.st.STANDBY{background:var(--kuning-mu);color:var(--kuning)}
.st.BREAKDOWN{background:var(--merah-mu);color:var(--merah)}
.st.OFF{background:#eceff1;color:#5d6c79}
.st.info{background:var(--biru-mu);color:var(--biru)}
.st.abu{background:#eceff1;color:#5d6c79}
.st.hijau{background:var(--hijau-mu);color:var(--hijau)}
.st.kuning{background:var(--kuning-mu);color:var(--kuning)}
.st.merah{background:var(--merah-mu);color:var(--merah)}
.st.tanah{background:var(--tanah-mu);color:var(--tanah2)}

.baris{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.klm{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.klm label{font-size:12px;color:var(--redup);font-weight:600}
.klm input,.klm select,.klm textarea{border:1px solid var(--garis);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.klm input:focus,.klm select:focus,.klm textarea:focus{outline:none;border-color:var(--tanah);box-shadow:0 0 0 3px var(--tanah-mu)}
.klm textarea{min-height:64px;resize:vertical}
.klm .bantu{font-size:11px;color:var(--redup)}
.klm.sempit{max-width:170px;flex:0 0 170px}

.info-kotak{background:var(--biru-mu);border:1px solid #c6d9e8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#1d4e79}
.awas-kotak{background:var(--kuning-mu);border:1px solid #ecdcae;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a5a05}
.bahaya-kotak{background:var(--merah-mu);border:1px solid #e8c5c5;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#8d1c1c}

/* modal */
#tirai{position:fixed;inset:0;background:rgba(16,24,32,.55);display:none;align-items:flex-start;
  justify-content:center;padding:26px 14px;z-index:70;overflow:auto}
#tirai.buka{display:flex}
.modal{background:var(--kertas);border-radius:14px;width:100%;max-width:760px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal-kop{padding:14px 18px;border-bottom:1px solid var(--garis2);display:flex;align-items:center;gap:10px}
.modal-kop .x{margin-left:auto;cursor:pointer;font-size:20px;color:var(--redup);line-height:1;padding:0 4px}
.modal-isi{padding:16px 18px;max-height:66vh;overflow:auto}
.modal-kaki{padding:12px 18px;border-top:1px solid var(--garis2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

#roti{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.roti{background:var(--baja);color:#fff;padding:9px 16px;border-radius:24px;font-size:13px;
  box-shadow:0 10px 24px rgba(0,0,0,.28);max-width:88vw}
.roti.ok{background:var(--hijau)} .roti.salah{background:var(--merah)}

.tab-bar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--garis);padding:0 12px;background:#fafcfd;border-radius:var(--r) var(--r) 0 0}
.tab-bar div{padding:9px 13px;cursor:pointer;font-size:13px;font-weight:600;color:var(--redup);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-bar div.aktif{color:var(--tanah2);border-bottom-color:var(--tanah)}

.foto-petak{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foto-petak figure{margin:0;border:1px solid var(--garis);border-radius:8px;overflow:hidden;background:#fff}
.foto-petak img{width:100%;height:112px;object-fit:cover;display:block;cursor:pointer}
.foto-petak figcaption{padding:6px 8px;font-size:11.5px;color:var(--redup)}

svg.grafik{width:100%;height:auto;display:block}

@media(max-width:980px){
  .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  #sisi{transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #sisi.buka{transform:none}
  #utama{margin-left:0}
  #bar .tombol-menu{display:inline-flex}
  #bar img.konsor{display:none}
  #isi{padding:12px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .kpi .nil{font-size:22px}
  #cap-air{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ====== CETAK ====== */
#cetak{display:none}
@media print{
  @page{size:A4;margin:12mm 12mm 14mm}
  body{background:#fff}
  #sisi,#bar,#tirai,#roti,#cap-air,#login{display:none!important}
  #utama{margin:0} #isi{display:none}
  #cetak{display:block!important}
  .pecah{page-break-after:always}
  .tab-cetak{width:100%;border-collapse:collapse;font-size:10.5px}
  .tab-cetak th,.tab-cetak td{border:1px solid #666;padding:3px 5px}
  .tab-cetak th{background:#eee}
}
.kop-cetak{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid var(--baja);padding-bottom:8px;margin-bottom:12px}
.kop-cetak img.kiri{height:44px}
.kop-cetak img.kanan{height:34px;margin-left:auto}
.kop-cetak .tg{font-size:13px;font-weight:700}
.kop-cetak .tg small{display:block;font-weight:400;font-size:10.5px;color:#444}
.ttd{display:flex;gap:20px;margin-top:26px;text-align:center;font-size:11px}
.ttd div{flex:1}
.ttd .garis{margin-top:52px;border-top:1px solid #333;padding-top:3px}
</style>
</head>
<body>

<div id="login">
  <div class="kartu-login">
    <div class="login-atas">
      <img class="aen" id="imgAenLogin" alt="PT. Avindo Energi Nusantara">
      <div class="judul">Earthwork Project Control</div>
      <div class="sub">PHSS Muara Badak &middot; land preparation &amp; hauling</div>
    </div>
    <div class="login-badan">
      <div style="font-size:12.5px;color:var(--redup);text-align:center;margin-bottom:8px">Masukkan PIN 6 angka</div>
      <div id="pinBox">
        <input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
        <input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
      </div>
      <div class="login-pesan" id="pesanLogin"></div>
      <button class="tbl utama" style="width:100%;justify-content:center" id="btnMasuk">Masuk</button>
      <div style="text-align:center;margin-top:10px">
        <button class="tbl kecil" id="btnPulih" style="border:none;background:none;color:var(--redup)">Pemulihan darurat</button>
      </div>
    </div>
    <div class="login-konsor">
      <img id="imgKonsorLogin" alt="Eni - Timas IKPT Consortium">
      <div class="ket">Pekerjaan untuk Konsorsium Eni &ndash; Timas IKPT di area Pertamina Hulu Sanga Sanga</div>
      <div class="ket" style="margin-top:5px" id="versiLogin"></div>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sisi">
    <div class="sisi-kop"><img id="imgAenSisi" alt="AEN"></div>
    <div class="sisi-proyek">
      <div class="nm" id="sisiNamaProyek">Earthwork PHSS Muara Badak</div>
      <div class="lk" id="sisiLokasi">Muara Badak &middot; Kutai Kartanegara</div>
    </div>
    <nav id="menu"></nav>
    <div class="sisi-kaki">
      <div id="sisiVersi"></div>
      <div style="margin-top:3px">Project Control by Ariel Chandra</div>
    </div>
  </aside>

  <div id="utama">
    <header id="bar">
      <button class="tbl kecil tombol-menu" id="btnDrawer">&#9776;</button>
      <div class="judul-hal" id="judulHal">Dashboard</div>
      <div class="kanan">
        <div class="chip-sync off" id="chipSync" title="Status sinkronisasi">Luring</div>
        <img class="konsor" id="imgKonsorBar" alt="Konsorsium">
        <div class="chip-user" id="chipUser">
          <div class="av" id="userAv">?</div>
          <div><div class="nm" id="userNm">-</div><div class="pr" id="userPr">-</div></div>
        </div>
      </div>
    </header>
    <main id="isi"></main>
    <img id="cap-air" alt="">
  </div>
</div>

<div id="tirai"><div class="modal" id="modal">
  <div class="modal-kop"><h3 id="modalJudul">Judul</h3><span class="x" id="modalX">&times;</span></div>
  <div class="modal-isi" id="modalIsi"></div>
  <div class="modal-kaki" id="modalKaki"></div>
</div></div>

<div id="roti"></div>
<div id="cetak"></div>

<script>
/* ===========================================================
   AEN PHSS MUARA BADAK — EARTHWORK PROJECT CONTROL
   File tunggal, bisa dipakai luring. Data disimpan di browser,
   dan bisa disinkronkan ke Google Sheets lewat Apps Script.

/* ---------- daftar tabel ---------- */
const TABEL = ["MASTER_PROJECT","USERS","MASTER_EQUIPMENT","MASTER_PERSONNEL","DAILY_REPORT",
"ATTENDANCE","EQUIP_DAILY_STATUS","TRUCK_RITASE","FUEL_RECEIVING","FUEL_DISPENSING",
"FUEL_STOCK_SNAPSHOT","PETTY_CASH","PURCHASE_REQUEST","PHOTO_LOG","DELAY_ISSUE",
"PROGRESS_VERIFIED","COST_TRANSACTION","VEHICLE_LOG","DAILY_EXCEPTION_HISTORY",
"DAILY_PROJECT_HEALTH","AUDIT_TRAIL"];

const KUNCI = "AEN_PHSS_DB";
const KUNCI_SESI = "AEN_PHSS_SESI";
let DB = null, USER = null, HAL = "dashboard", DRAWER = false;

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = p => (p||"R") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
const hariIni = () => new Date().toISOString().slice(0,10);
const jamKini = () => new Date().toTimeString().slice(0,5);
const skrg = () => new Date().toISOString().slice(0,19).replace("T"," ");
const n = v => { const x = parseFloat(String(v==null?"":v).replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",", ".")); return isFinite(x)?x:0; };
const ang = (v,d=0) => (isFinite(v)?v:0).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d});
const rp = v => "Rp " + ang(Math.round(v||0));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tglID = s => { if(!s) return "-"; const p = String(s).slice(0,10).split("-"); if(p.length<3) return s;
  const bl = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return p[2] + " " + bl[+p[1]-1] + " " + p[0]; };
const tglPanjang = s => { if(!s) return "-"; const p = String(s).slice(0,10).split("-");
  const bl = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return (+p[2]) + " " + bl[+p[1]-1] + " " + p[0]; };
const tambahHari = (s,d) => { const t = new Date(s+"T00:00:00"); t.setDate(t.getDate()+d); return t.toISOString().slice(0,10); };
const selisihHari = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000);
const bagi = (a,b) => (b? a/b : 0);

function roti(pesan, jenis){
  const d = document.createElement("div");
  d.className = "roti " + (jenis||"");
  d.textContent = pesan; $("#roti").appendChild(d);
  setTimeout(()=>{ d.style.opacity=0; setTimeout(()=>d.remove(),400); }, 2600);
}

/* ---------- database lokal ---------- */
function dbKosong(){ const o = {}; TABEL.forEach(t=>o[t]=[]); return o; }
function muatDB(){
  try{ const s = localStorage.getItem(KUNCI); DB = s? JSON.parse(s) : dbKosong(); }
  catch(e){ DB = dbKosong(); }
  TABEL.forEach(t=>{ if(!Array.isArray(DB[t])) DB[t]=[]; });
  if(!DB._meta) DB._meta = {ubah:{}, nisan:[], gasUrl:"", gasToken:"", sinkronTerakhir:""};
  if(!DB._meta.ubah) DB._meta.ubah = {};
  if(!DB._meta.nisan) DB._meta.nisan = [];
}
function simpanDB(){
  try{ localStorage.setItem(KUNCI, JSON.stringify(DB)); }
  catch(e){ roti("Penyimpanan browser penuh. Unduh cadangan lalu hapus foto lama.","salah"); }
}
function tabel(t){ return DB[t] || (DB[t]=[]); }
function cari(t, id){ return tabel(t).find(r=>r.id===id); }

function tulis(t, obj, catatan){
  const ada = obj.id && cari(t, obj.id);
  if(ada){
    const lama = JSON.stringify(ada);
    Object.assign(ada, obj); ada._ubah = skrg();
    audit(t, ada.id, "UBAH", catatan||"", lama);
  } else {
    obj.id = obj.id || uid(t.slice(0,3));
    obj._buat = skrg(); obj._ubah = skrg(); obj._oleh = USER? USER.nama : "sistem";
    tabel(t).push(obj);
    audit(t, obj.id, "TAMBAH", catatan||"", "");
  }
  DB._meta.ubah[t] = skrg();
  simpanDB(); return obj;
}
function hapus(t, id, alasan){
  const i = tabel(t).findIndex(r=>r.id===id); if(i<0) return;

function kecilkanFoto(file, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const maks = 900, r = Math.min(1, maks/Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*r); c.height = Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg", .55));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function tabelHTML(rows, kolom, opsi){
  opsi = opsi||{};
  if(!rows.length) return `<div class="kosong"><b>${opsi.judulKosong||"Belum ada data"}</b>${opsi.pesanKosong||"Tekan tombol tambah untuk mulai mengisi."}</div>`;
  const th = kolom.map(k=>`<th${k.num?' style="text-align:right"':""}>${esc(k.l)}</th>`).join("");
  const tr = rows.map(r=>{
    const td = kolom.map(k=>{
      let v = k.f? k.f(r) : r[k.k];
      if(k.num) return `<td class="num">${v==null||v===""?"-":(typeof v==="number"? ang(v,k.des||0):v)}</td>`;
      return `<td>${k.html? (v||"") : esc(v==null||v===""?"-":v)}</td>`;
    }).join("");
    const aksi = opsi.aksi? `<td style="white-space:nowrap">${opsi.aksi(r)}</td>` : "";
    return `<tr>${td}${aksi}</tr>`;
  }).join("");
  return `<div class="gulir"><table class="tab"><thead><tr>${th}${opsi.aksi?"<th></th>":""}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function unduhTeks(nama, isi, tipe){
  const b = new Blob([isi], {type: tipe||"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nama; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function keCSV(rows, kolom, nama){
  const baris = [kolom.map(k=>k.l).join(";")].concat(rows.map(r=>kolom.map(k=>{
    let v = k.f? k.f(r) : r[k.k]; v = String(v==null?"":v).replace(/<[^>]+>/g,"").replace(/;/g,",");
    return v; }).join(";")));
  unduhTeks(nama, "\ufeff" + baris.join("\n"), "text/csv;charset=utf-8");
}

/* ---------- grafik sederhana ---------- */
function grafikGaris(seri, opsi){
  opsi = opsi||{};
  const W=760, H=opsi.tinggi||230, L=54, R=14, T=14, B=34;
  const semua = seri.flatMap(s=>s.data.map(d=>d.y));
  const maks = Math.max(1, ...semua) * 1.12;
  const labels = seri[0]? seri[0].data.map(d=>d.x) : [];
  const px = i => L + (labels.length<2? (W-L-R)/2 : i*(W-L-R)/(labels.length-1));
  const py = v => H-B - (v/maks)*(H-B-T);
  let g = `<svg class="grafik" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){ const y = T + i*(H-B-T)/4, val = maks - i*maks/4;
    g += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e4e9ed"/>
          <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#5d6c79">${ang(val, maks<12?1:0)}</text>`; }
  seri.forEach(s=>{
    const d = s.data.map((p,i)=>`${i?"L":"M"}${px(i)},${py(p.y)}`).join(" ");
    if(s.area) g += `<path d="${d} L${px(s.data.length-1)},${H-B} L${px(0)},${H-B} Z" fill="${s.warna}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.warna}" stroke-width="2.2" stroke-linejoin="round"/>`;
    s.data.forEach((p,i)=> g += `<circle cx="${px(i)}" cy="${py(p.y)}" r="2.6" fill="${s.warna}"/>`);
  });
  const langkah = Math.ceil(labels.length/8)||1;
  labels.forEach((l,i)=>{ if(i%langkah) return;
    g += `<text x="${px(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#5d6c79">${esc(l)}</text>`; });
  g += `</svg>`;
  const legenda = seri.filter(s=>s.nama).map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px">
    <i style="width:14px;height:3px;background:${s.warna};display:inline-block;border-radius:2px"></i>${esc(s.nama)}</span>`).join("");
  return g + `<div style="padding:6px 2px 0">${legenda}</div>`;
}
function grafikBatang(data, opsi){
  opsi = opsi||{};
  const W=760, H=opsi.tinggi||210, L=54, R=14, T=12, B=34;
  const maks = Math.max(1, ...data.map(d=>d.y))*1.15;
  const lebar = (W-L-R)/Math.max(1,data.length);
  let g = `<svg class="grafik" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){ const y = T + i*(H-B-T)/4;
    g += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e4e9ed"/>
          <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#5d6c79">${ang(maks-i*maks/4,0)}</text>`; }
  data.forEach((d,i)=>{
    const h = (d.y/maks)*(H-B-T), x = L + i*lebar + lebar*.18, w = lebar*.64;
    g += `<rect x="${x}" y="${H-B-h}" width="${w}" height="${h}" rx="3" fill="${d.warna||"#b5721c"}"/>
          <text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="#5d6c79">${esc(d.x)}</text>`;
  });
  return g + `</svg>`;
}
/* ---------- perhitungan turunan ---------- */
const H = {
  unit(id){ return cari("MASTER_EQUIPMENT", id) || {nama:id, kapasitas:P().kapasitasDT}; },
  daftarUnit(jenis){ return tabel("MASTER_EQUIPMENT").filter(u=> (!jenis || u.jenis===jenis) && u.aktif!=="Tidak"); },
  namaUnit(id){ const u = cari("MASTER_EQUIPMENT", id); return u? (u.sticker||u.nama) : (id||"-"); },

  ritHari(tgl){ return tabel("TRUCK_RITASE").filter(r=>r.tanggal===tgl); },
  volOps(tgl){ return H.ritHari(tgl).reduce((a,r)=> a + n(r.rit) * (n(r.kapasitas)|| n(H.unit(r.unit).kapasitas) || P().kapasitasDT), 0); },
  volOpsTotal(){ return tabel("TRUCK_RITASE").reduce((a,r)=> a + n(r.rit) * (n(r.kapasitas)|| n(H.unit(r.unit).kapasitas) || P().kapasitasDT), 0); },
  ritTotal(){ return tabel("TRUCK_RITASE").reduce((a,r)=>a+n(r.rit),0); },

  hmHari(tgl){ return tabel("EQUIP_DAILY_STATUS").filter(r=>r.tanggal===tgl)
      .reduce((a,r)=> a + (n(r.jamKerja) || Math.max(0, n(r.hmAkhir)-n(r.hmAwal))), 0); },
  hmTotal(){ return tabel("EQUIP_DAILY_STATUS").reduce((a,r)=> a + (n(r.jamKerja) || Math.max(0,n(r.hmAkhir)-n(r.hmAwal))), 0); },

  verifiedTotal(){ return tabel("PROGRESS_VERIFIED").reduce((a,r)=>a+n(r.volume),0); },
  verifiedSampai(tgl){ return tabel("PROGRESS_VERIFIED").filter(r=>r.tanggal<=tgl).reduce((a,r)=>a+n(r.volume),0); },
  progresPersen(){ return Math.min(100, bagi(H.verifiedTotal(), n(P().volBaseline))*100); },

  solarTerima(tgl){ const a = tabel("FUEL_RECEIVING"); return (tgl? a.filter(r=>r.tanggal===tgl):a).reduce((s,r)=>s+n(r.qtyTerima),0); },
  solarPakai(tgl){ const a = tabel("FUEL_DISPENSING"); return (tgl? a.filter(r=>r.tanggal===tgl):a).reduce((s,r)=>s+n(r.liter),0); },
  stokSolar(sampai){
    const p = P(); const tr = tabel("FUEL_RECEIVING").filter(r=>!sampai||r.tanggal<=sampai).reduce((s,r)=>s+n(r.qtyTerima),0);
    const pk = tabel("FUEL_DISPENSING").filter(r=>!sampai||r.tanggal<=sampai).reduce((s,r)=>s+n(r.liter),0);
    return n(p.stokAwalSolar) + tr - pk;
  },
  solarUnit(unit, tgl){ return tabel("FUEL_DISPENSING").filter(r=>r.unit===unit && (!tgl||r.tanggal===tgl)).reduce((s,r)=>s+n(r.liter),0); },

  biayaSolar(){ return tabel("FUEL_RECEIVING").reduce((s,r)=> s + (n(r.nilai) || n(r.qtyTerima)*(n(r.harga)||n(P().hargaSolar))), 0); },
  biayaKas(){ return tabel("PETTY_CASH").filter(r=>r.jenis!=="MASUK").reduce((s,r)=>s+n(r.nominal),0); },
  biayaLain(){ return tabel("COST_TRANSACTION").reduce((s,r)=>s+n(r.nilai),0); },
  biayaTotal(){ return H.biayaSolar() + H.biayaKas() + H.biayaLain(); },
  biayaPerKelompok(){
    const m = {};
    const tmb = (k,v) => m[k] = (m[k]||0) + v;
    tmb("Solar", H.biayaSolar());
    tabel("PETTY_CASH").filter(r=>r.jenis!=="MASUK").forEach(r=> tmb(r.kategori||"Petty cash", n(r.nominal)));
    tabel("COST_TRANSACTION").forEach(r=> tmb(r.kelompok||"Lain-lain", n(r.nilai)));
    return m;
  },
  biayaPerM3(){ return bagi(H.biayaTotal(), H.verifiedTotal() || H.volOpsTotal()); },

  hariAktif(){ const s = new Set(); tabel("DAILY_REPORT").forEach(r=>s.add(r.tanggal));
    tabel("TRUCK_RITASE").forEach(r=>s.add(r.tanggal)); return Array.from(s).filter(Boolean).sort(); },
  produksiRata(hari){
    hari = hari||7; const semua = H.hariAktif().slice(-hari);
    if(!semua.length) return 0;
    const v = semua.reduce((a,t)=>{
      const ver = tabel("PROGRESS_VERIFIED").filter(r=>r.tanggal===t).reduce((s,r)=>s+n(r.volume),0);
      return a + (ver || H.volOps(t)); }, 0);
    return v/semua.length;
  },
  prakiraan(){
    const p = P(), base = n(p.volBaseline), ver = H.verifiedTotal();
    const sisa = Math.max(0, base - ver), laju = H.produksiRata(7);
    const hariSisa = laju>0? Math.ceil(sisa/laju) : null;
    const hariJalan = H.hariAktif().length || 1;
    const biayaHari = H.biayaTotal()/hariJalan;
    const biayaAkhir = H.biayaTotal() + (hariSisa||0)*biayaHari;
    return {sisa, laju, hariSisa, hariJalan, biayaHari, biayaAkhir,
      selesai: hariSisa!=null? tambahHari(hariIni(), hariSisa) : null,
      margin: n(p.nilaiSpk) - biayaAkhir,
      marginPersen: n(p.nilaiSpk)? (n(p.nilaiSpk)-biayaAkhir)/n(p.nilaiSpk)*100 : 0};
  },
  kesehatanHari(tgl){
    const rit = H.ritHari(tgl).reduce((a,r)=>a+n(r.rit),0);
    const vol = H.volOps(tgl);
    const ver = tabel("PROGRESS_VERIFIED").filter(r=>r.tanggal===tgl).reduce((a,r)=>a+n(r.volume),0);
    const hm = H.hmHari(tgl), bbm = H.solarPakai(tgl);
    const kas = tabel("PETTY_CASH").filter(r=>r.tanggal===tgl && r.jenis!=="MASUK").reduce((a,r)=>a+n(r.nominal),0);
    const bbmRp = tabel("FUEL_RECEIVING").filter(r=>r.tanggal===tgl).reduce((a,r)=>a+(n(r.nilai)||n(r.qtyTerima)*n(r.harga)),0);
    const lain = tabel("COST_TRANSACTION").filter(r=>r.tanggal===tgl).reduce((a,r)=>a+n(r.nilai),0);
    const delay = tabel("DELAY_ISSUE").filter(r=>r.tanggal===tgl).reduce((a,r)=>a+n(r.durasi),0);
    const exc = tabel("DAILY_EXCEPTION_HISTORY").filter(r=>String(r.tanggal).slice(0,10)===tgl).length;
    const biaya = kas + bbmRp + lain;
    return {tanggal:tgl, rit, vol, ver, hm, bbm, biaya, delay, exc,
      lperHM: bagi(bbm,hm), lperRit: bagi(bbm,rit), lperM3: bagi(bbm, ver||vol), biayaPerM3: bagi(biaya, ver||vol)};
  }
};

function gambarMenu(){
  const m = $("#menu"); m.innerHTML = "";
  let grup = null, isiGrup = 0;
  MENU.forEach(it=>{
    if(it.g){ grup = it.g; isiGrup = 0; return; }
    if(it.peran.indexOf(USER.peran)<0) return;
    if(grup && !isiGrup){ const d = document.createElement("div"); d.className="menu-grup"; d.textContent = grup; m.appendChild(d); isiGrup = 1; }
    const d = document.createElement("div");
    d.className = "menu-item" + (HAL===it.id? " aktif":"");
    let lonceng = "";
    if(it.id==="exception"){ const c = tabel("DAILY_EXCEPTION_HISTORY").filter(x=>["Open","Under Review"].indexOf(x.status)>=0).length;
      if(c) lonceng = `<span class="lonceng">${c}</span>`; }
    d.innerHTML = `<span class="ik">${it.ik}</span><span>${it.l}</span>${lonceng}`;
    d.onclick = () => buka(it.id);
    m.appendChild(d);
  });
}
function buka(id){
  HAL = id; DRAWER = false; $("#sisi").classList.remove("buka");
  const it = MENU.find(x=>x.id===id);
  $("#judulHal").textContent = it? it.l : id;
  gambarMenu(); window.scrollTo(0,0);
  const fn = HALAMAN[id];
  $("#isi").innerHTML = fn? fn() : `<div class="kartu"><div class="kartu-isi">Halaman belum tersedia.</div></div>`;
  if(SESUDAH[id]) SESUDAH[id]();
}
function masuk(){
  $("#login").style.display = "none"; $("#app").style.display = "block";
  $("#userNm").textContent = USER.nama;
  $("#userPr").textContent = PERAN[USER.peran].nama;
  $("#userAv").textContent = USER.nama.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();

   =========================================================== */
let CRUD = null;
let FIL = {dari:"", sampai:"", cari:""};

function saringBaris(rows, cfg){
  let r = rows.slice();
  if(cfg.tanggal!==false){
    if(FIL.dari) r = r.filter(x=>(x.tanggal||"") >= FIL.dari);
    if(FIL.sampai) r = r.filter(x=>(x.tanggal||"") <= FIL.sampai);
  }
  if(FIL.cari){ const q = FIL.cari.toLowerCase();
    r = r.filter(x=>JSON.stringify(x).toLowerCase().indexOf(q)>=0); }
  return r.sort((a,b)=> String(b.tanggal||b._buat||"").localeCompare(String(a.tanggal||a._buat||"")) || String(b._buat||"").localeCompare(String(a._buat||"")));
}
function crudHTML(cfg){
  CRUD = cfg;
  const bolehInput = boleh(cfg.izin||"inputHarian");
  const rows = saringBaris(tabel(cfg.tabel), cfg);
  const aksi = r => {
    let h = "";
    if(bolehInput) h += `<button class="tbl kecil" onclick="crudEdit('${r.id}')">Ubah</button> `;
    if(boleh("hapus")) h += `<button class="tbl kecil bahaya" onclick="crudHapus('${r.id}')">Hapus</button>`;
    return h;
  };
  return `
  <div class="kartu">
    <div class="kartu-kop">
      <h3>${esc(cfg.judul)}</h3>
      <div class="kanan">
        ${cfg.tombolTambahan||""}
        <button class="tbl kecil" onclick="crudCSV()">Unduh CSV</button>
        ${bolehInput? `<button class="tbl utama kecil" onclick="crudTambah()">+ ${esc(cfg.tambahTeks||"Tambah")}</button>`:""}
      </div>
    </div>
    <div class="kartu-isi">
      ${cfg.catatan? `<div class="info-kotak" style="margin-bottom:12px">${cfg.catatan}</div>`:""}
      <div class="baris">
        ${cfg.tanggal===false? "" : `
        <div class="klm sempit"><label>Dari tanggal</label><input type="date" id="filDari" value="${FIL.dari}"></div>
        <div class="klm sempit"><label>Sampai tanggal</label><input type="date" id="filSampai" value="${FIL.sampai}"></div>`}
        <div class="klm"><label>Cari</label><input id="filCari" value="${esc(FIL.cari)}" placeholder="nama, unit, keterangan..."></div>
        <div class="klm sempit"><label>&nbsp;</label><button class="tbl" onclick="crudSaring()">Terapkan</button></div>
        <div class="klm sempit"><label>&nbsp;</label><button class="tbl" onclick="crudReset()">Semua data</button></div>
      </div>
      ${cfg.ringkas? `<div class="grid g4" style="margin-top:14px">${cfg.ringkas(rows)}</div>`:""}
    </div>
    <div class="kartu-isi rapat">
      ${tabelHTML(rows, cfg.kolom, {aksi: (bolehInput||boleh("hapus"))? aksi : null,
        judulKosong: cfg.judulKosong||"Belum ada catatan", pesanKosong: cfg.pesanKosong||"Data yang diinput akan muncul di sini."})}
    </div>
  </div>`;
}
function crudSaring(){
  FIL.dari = ($("#filDari")||{}).value || "";
  FIL.sampai = ($("#filSampai")||{}).value || "";
  FIL.cari = ($("#filCari")||{}).value || "";
  buka(HAL);
}
function crudReset(){ FIL = {dari:"", sampai:"", cari:""}; buka(HAL); }
function crudCSV(){ keCSV(saringBaris(tabel(CRUD.tabel), CRUD), CRUD.kolom, CRUD.tabel + "_" + hariIni() + ".csv"); }
function crudTambah(){ formRecord(null); }
function crudEdit(id){ formRecord(cari(CRUD.tabel, id)); }
function crudHapus(id){
  const r = cari(CRUD.tabel, id); if(!r) return;
  modal("Hapus catatan", `<div class="bahaya-kotak">Catatan ini akan dihapus dan tetap tercatat di jejak audit.</div>
    <div class="baris" style="margin-top:10px"><div class="klm"><label>Alasan penghapusan</label><input id="alasanHapus" placeholder="mis. dobel input"></div></div>`,
    [{teks:"Batal", aksi:tutupModal},{teks:"Hapus", kelas:"bahaya", aksi:()=>{
      hapus(CRUD.tabel, id, $("#alasanHapus").value); tutupModal(); roti("Catatan dihapus.","ok"); buka(HAL); }}]);
}
function formRecord(data){
  const cfg = CRUD, f = typeof cfg.fields==="function"? cfg.fields(data) : cfg.fields;
  modal((data?"Ubah ":"Tambah ") + (cfg.tambahTeks||cfg.judul).toLowerCase(), formHTML(f, data), [
    {teks:"Batal", aksi:tutupModal},
    {teks:"Simpan", kelas:"utama", aksi:()=>{
      const o = bacaForm(f);
      const kurang = f.filter(x=>x.wajib && !String(o[x.k]||"").trim());
      if(kurang.length){ roti("Lengkapi dulu: " + kurang.map(x=>x.l).join(", "), "salah"); return; }
      if(cfg.sebelumSimpan){ const pesan = cfg.sebelumSimpan(o, data); if(pesan){ roti(pesan,"salah"); return; } }
      if(data) o.id = data.id;
      tulis(cfg.tabel, o, cfg.judul);
      tutupModal(); roti("Tersimpan.","ok"); buka(HAL);
      if(cfg.sesudahSimpan) cfg.sesudahSimpan(o);
    }}
  ]);
  pasangFoto();
}

/* --- exception monitor --- */
function pindaiException(){
  const p = P(), baru = [];
  const sudah = new Set(tabel("DAILY_EXCEPTION_HISTORY").map(r=>r.kunci));
  const tambah = (kunci, tgl, kat, objek, temuan, aktual, banding, sev, rp_) => {
    if(sudah.has(kunci)) return;
    baru.push({id:uid("EXC"), kunci, tanggal:tgl, kategori:kat, objek, temuan, aktual, pembanding:banding,
      deviasi:"", severity:sev, status:"Open", klarifikasi:"", reviewPC:"", eksposur: rp_||0, dibuat:skrg()});
  };
  const hari = H.hariAktif();
  tabel("FUEL_DISPENSING").forEach(f=>{
    const st = tabel("EQUIP_DAILY_STATUS").find(s=>s.tanggal===f.tanggal && s.unit===f.unit);
    if(st && (st.status==="BREAKDOWN" || st.status==="OFF"))
      tambah("BBM-STATUS|"+f.id, f.tanggal, "Fuel", H.namaUnit(f.unit),
        "Pengisian solar saat unit berstatus " + st.status, ang(n(f.liter),1)+" L", "seharusnya tidak ada pemakaian",
        "Critical", n(f.liter)*n(p.hargaSolar));
    if(!f.bukti) tambah("BBM-BUKTI|"+f.id, f.tanggal, "Fuel", H.namaUnit(f.unit),
      "Pengisian solar tanpa foto bukti meter", ang(n(f.liter),1)+" L", "bukti wajib", "Info", 0);
  });
  hari.forEach(t=>{
    H.daftarUnit().forEach(u=>{
      const liter = tabel("FUEL_DISPENSING").filter(r=>r.tanggal===t && r.unit===u.id).reduce((a,r)=>a+n(r.liter),0);
      if(!liter) return;
      const st = tabel("EQUIP_DAILY_STATUS").find(s=>s.tanggal===t && s.unit===u.id) || {};
      const jam = n(st.jamKerja) || Math.max(0, n(st.hmAkhir)-n(st.hmAwal));
      const rit = tabel("TRUCK_RITASE").filter(r=>r.tanggal===t && r.unit===u.id).reduce((a,r)=>a+n(r.rit),0);
      if(u.jenis==="Excavator" && jam && bagi(liter,jam) > n(p.batasLperHM))
        tambah("LHM|"+t+"|"+u.id, t, "Fuel", u.sticker||u.nama, "Konsumsi solar per jam di atas batas",
          ang(bagi(liter,jam),2)+" L/HM", ang(n(p.batasLperHM),1)+" L/HM", "Warning", (liter - jam*n(p.batasLperHM))*n(p.hargaSolar));
      if(u.jenis==="Dump Truck" && rit && bagi(liter,rit) > n(p.batasLperRit))
        tambah("LRIT|"+t+"|"+u.id, t, "Fuel", u.sticker||u.nama, "Konsumsi solar per rit di atas batas",
          ang(bagi(liter,rit),2)+" L/rit", ang(n(p.batasLperRit),1)+" L/rit", "Warning", (liter - rit*n(p.batasLperRit))*n(p.hargaSolar));
    });
    tabel("EQUIP_DAILY_STATUS").filter(s=>s.tanggal===t && s.status==="OPERASI").forEach(s=>{
      const u = H.unit(s.unit);
      const rit = tabel("TRUCK_RITASE").filter(r=>r.tanggal===t && r.unit===s.unit).reduce((a,r)=>a+n(r.rit),0);
      const jam = n(s.jamKerja) || Math.max(0, n(s.hmAkhir)-n(s.hmAwal));
      if(u.jenis==="Dump Truck" && !rit)
        tambah("OPS-NORIT|"+t+"|"+s.unit, t, "Equipment", u.sticker||u.nama, "Unit berstatus OPERASI tetapi ritase kosong", "0 rit", "minimal 1 rit", "Warning", 0);
      if(u.jenis==="Excavator" && !jam)
        tambah("OPS-NOHM|"+t+"|"+s.unit, t, "Equipment", u.sticker||u.nama, "Unit berstatus OPERASI tetapi jam kerja kosong", "0 jam", "HM awal-akhir diisi", "Warning", 0);
    });
    if(!tabel("DAILY_REPORT").some(r=>r.tanggal===t))
      tambah("NOLAP|"+t, t, "Progress", "Laporan harian", "Ada kegiatan lapangan tetapi laporan harian belum dibuat", "-", "1 laporan / hari", "Warning", 0);
    if(!tabel("PHOTO_LOG").some(r=>r.tanggal===t))
      tambah("NOFOTO|"+t, t, "Photo/evidence", "Dokumentasi", "Hari kerja tanpa foto dokumentasi", "0 foto", "minimal 1 foto", "Info", 0);
    if(!tabel("ATTENDANCE").some(r=>r.tanggal===t))
      tambah("NOABS|"+t, t, "Attendance", "Absensi", "Hari kerja tanpa catatan absensi", "0 catatan", "seluruh manpower", "Warning", 0);
    const delay = tabel("DELAY_ISSUE").filter(r=>r.tanggal===t).reduce((a,r)=>a+n(r.durasi),0);
    if(delay >= 4) tambah("DELAY|"+t, t, "Progress", "Produktivitas", "Delay harian tinggi", ang(delay,1)+" jam", "< 4 jam", "Warning", 0);
  });
  tabel("FUEL_STOCK_SNAPSHOT").forEach(o=>{
    const sel = n(o.fisik) - H.stokSolar(o.tanggal);
    if(Math.abs(sel) > 20) tambah("STOK|"+o.id, o.tanggal, "Fuel", "Tangki solar", "Selisih stok fisik vs teoritis",
      ang(sel,1)+" L", "toleransi ±20 L", Math.abs(sel)>60?"Critical":"Warning", Math.abs(sel)*n(p.hargaSolar));
  });
  baru.forEach(b=>{ tabel("DAILY_EXCEPTION_HISTORY").push(b); });
  if(baru.length){ DB._meta.ubah.DAILY_EXCEPTION_HISTORY = skrg(); simpanDB(); }
  return baru.length;
}

const EXC_KOL = [
  {l:"Tanggal", f:r=>tglID(r.tanggal)},
  {l:"Severity", html:1, f:r=>`<span class="st ${r.severity==="Critical"?"merah":(r.severity==="Warning"?"kuning":"info")}">${esc(r.severity)}</span>`},
  {l:"Kategori", k:"kategori"},{l:"Objek", k:"objek"},{l:"Temuan", k:"temuan"},
  {l:"Aktual", k:"aktual"},{l:"Pembanding", k:"pembanding"},
  {l:"Eksposur", num:1, f:r=>n(r.eksposur)},
  {l:"Status", html:1, f:r=>`<span class="st ${["Closed","Corrected","Explained"].indexOf(r.status)>=0?"hijau":"abu"}">${esc(r.status)}</span>`},
  {l:"Klarifikasi site", k:"klarifikasi"},{l:"Review PC", k:"reviewPC"}
];
function jalankanPindai(){
  const c = pindaiException();
  roti(c? c + " temuan baru." : "Tidak ada temuan baru.", c? "":"ok");
  buka("exception");
}
function tanganiExc(id){
  const r = cari("DAILY_EXCEPTION_HISTORY", id); if(!r) return;
  const pc = boleh("exception");
  modal("Tindak lanjut temuan", `
    <div class="awas-kotak"><b>${esc(r.temuan)}</b><br>${esc(r.objek)} · ${tglID(r.tanggal)} · aktual ${esc(r.aktual)} (pembanding ${esc(r.pembanding)})</div>
    <div class="baris" style="margin-top:12px">
      <div class="klm" style="flex:1 1 100%"><label>Penjelasan site</label><textarea id="excKlar">${esc(r.klarifikasi||"")}</textarea></div>
      ${pc? `<div class="klm" style="flex:1 1 100%"><label>Keputusan Project Control</label><textarea id="excReview">${esc(r.reviewPC||"")}</textarea></div>
      <div class="klm sempit"><label>Status</label><select id="excStatus">
        ${["Open","Under Review","Explained","Corrected","Escalated","Closed"].map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="klm sempit"><label>Potensi kerugian (Rp)</label><input type="number" id="excRp" value="${n(r.eksposur)}"></div>`:""}
    </div>`,
    [{teks:"Batal", aksi:tutupModal},{teks:"Simpan", kelas:"utama", aksi:()=>{
      const o = {id:r.id, klarifikasi: $("#excKlar").value};
      if(pc){ o.reviewPC = $("#excReview").value; o.status = $("#excStatus").value; o.eksposur = n($("#excRp").value); }
      else if(r.status==="Open") o.status = "Under Review";
      tulis("DAILY_EXCEPTION_HISTORY", o, "tindak lanjut exception");
      tutupModal(); roti("Tersimpan.","ok"); buka("exception");
    }}]);
}

/* --- prakiraan & margin --- */
HALAMAN.prakiraan = () => {
  const p = P(), f = H.prakiraan(), base = n(p.volBaseline);
  const hari = H.hariAktif();
  let kum = 0;
  const aktual = hari.map(t=>{ kum = H.verifiedSampai(t) || kum + H.volOps(t); return {x:tglID(t).slice(0,6), y:kum}; });
  const durasi = n(p.durasi)||30;
  const rencana = hari.map((t,i)=>({x:tglID(t).slice(0,6), y: Math.min(base, base*(i+1)/durasi)}));
  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="lab">Sisa volume</div><div class="nil">${ang(f.sisa)}</div><div class="ket">m³ dari baseline ${ang(base)}</div></div>
    <div class="kpi biru"><div class="lab">Laju 7 hari</div><div class="nil">${ang(f.laju,1)}</div><div class="ket">m³ per hari</div></div>
    <div class="kpi ${f.hariSisa==null?"":"hijau"}"><div class="lab">Perkiraan selesai</div><div class="nil" style="font-size:19px">${f.selesai? tglID(f.selesai):"belum bisa dihitung"}</div><div class="ket">${f.hariSisa!=null? f.hariSisa+" hari kerja lagi":"isi progress verified dulu"}</div></div>
    <div class="kpi ${f.margin<0?"merah":"hijau"}"><div class="lab">Prakiraan margin</div><div class="nil" style="font-size:20px">${p.nilaiSpk? rp(f.margin):"nilai SPK kosong"}</div><div class="ket">${p.nilaiSpk? ang(f.marginPersen,1)+"% dari nilai SPK":"isi di Master data"}</div></div>
  </div>
  <div class="kartu"><div class="kartu-kop"><h3>Kurva kemajuan kumulatif</h3><div class="kanan"><span class="st abu">rencana lurus ${durasi} hari</span></div></div>
    <div class="kartu-isi">${hari.length? grafikGaris([
      {nama:"Rencana", warna:"#5d6c79", data:rencana},
      {nama:"Aktual kumulatif", warna:"#b5721c", area:1, data:aktual}]) :
      `<div class="kosong"><b>Belum ada data harian</b>Kurva terbentuk setelah ritase atau progress verified terisi.</div>`}</div></div>
  <div class="kartu"><div class="kartu-kop"><h3>Rincian prakiraan biaya</h3></div>
    <div class="kartu-isi rapat">${tabelHTML([
      {a:"Hari kerja berjalan", b:ang(f.hariJalan)+" hari"},
      {a:"Biaya aktual sampai hari ini", b:rp(H.biayaTotal())},
      {a:"Rata-rata biaya per hari", b:rp(f.biayaHari)},
      {a:"Perkiraan tambahan hari", b: f.hariSisa!=null? ang(f.hariSisa)+" hari" : "-"},
      {a:"Prakiraan biaya akhir proyek", b:rp(f.biayaAkhir)},
      {a:"Nilai SPK", b: p.nilaiSpk? rp(p.nilaiSpk):"belum diisi"},
      {a:"Prakiraan margin", b: p.nilaiSpk? rp(f.margin)+" ("+ang(f.marginPersen,1)+"%)" : "-"},
      {a:"Biaya per m³ saat ini", b:rp(H.biayaPerM3())}
    ], [{l:"Uraian", k:"a"},{l:"Nilai", k:"b"}])}</div>
    <div class="kartu-isi"><div class="info-kotak">Biaya dan margin adalah data internal AEN. Jangan dilampirkan pada laporan yang dikirim ke konsorsium atau PHSS.</div></div>

   SINKRONISASI KE GOOGLE SHEETS (APPS SCRIPT)
   =========================================================== */
const Sync = {
  sibuk:false, pesan:"",
  url(){ return (DB._meta.gasUrl||"").trim(); },
  token(){ return (DB._meta.gasToken||"").trim(); },
  aktif(){ return !!this.url(); },
  perbarui(status){
    const c = $("#chipSync"); if(!c) return;
    if(!this.aktif()){ c.className = "chip-sync off"; c.textContent = "Luring"; return; }
    if(status==="jalan"){ c.className = "chip-sync tunggu"; c.textContent = "Menyinkronkan…"; return; }
    if(status==="gagal"){ c.className = "chip-sync gagal"; c.textContent = "Gagal sinkron"; return; }
    c.className = "chip-sync ok";
    c.textContent = "Tersinkron" + (DB._meta.sinkronTerakhir? " " + DB._meta.sinkronTerakhir.slice(11,16) : "");
  },
  async panggil(fn, muatan){
    const u = this.url() + (this.url().indexOf("?")>0? "&":"?") + "fn=" + fn + "&token=" + encodeURIComponent(this.token());
    const opsi = muatan? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(muatan)} : {method:"GET"};
    const ctl = new AbortController(); const jam = setTimeout(()=>ctl.abort(), 90000);
    try{
      const r = await fetch(u, Object.assign({signal:ctl.signal, redirect:"follow"}, opsi));
      const teks = await r.text();
      let j; try{ j = JSON.parse(teks); }catch(e){ throw new Error("Jawaban server tidak dikenali. Pastikan Web App dibagikan ke 'Anyone'."); }
      if(!j.ok) throw new Error(j.pesan || "Server menolak permintaan.");
      return j;
    } finally { clearTimeout(jam); }
  },
  gabung(server){
    let ubah = 0;
    TABEL.forEach(t=>{
      const dari = server[t]; if(!Array.isArray(dari)) return;
      const peta = {}; tabel(t).forEach(r=>peta[r.id]=r);
      dari.forEach(rs=>{
        if(!rs || !rs.id) return;
        if(DB._meta.nisan.some(x=>x.id===rs.id)) return;
        const lokal = peta[rs.id];
        if(!lokal){ tabel(t).push(rs); ubah++; }
        else if(String(rs._ubah||"") > String(lokal._ubah||"")){ Object.assign(lokal, rs); ubah++; }
      });
    });
    if(ubah) simpanDB();
    return ubah;
  },
  bedaKirim(server){
    const kirim = {};
    TABEL.forEach(t=>{
      const peta = {}; (server[t]||[]).forEach(r=>peta[r.id]=r);
      const beda = tabel(t).filter(r=>{ const s = peta[r.id]; return !s || String(s._ubah||"") < String(r._ubah||""); });
      if(beda.length) kirim[t] = beda;
    });
    return kirim;
  },
  async jalan(diam){
    if(!this.aktif()){ if(!diam) roti("Alamat Web App belum diisi di Pengaturan.","salah"); return; }
    if(this.sibuk) return;
    this.sibuk = true; this.perbarui("jalan");
    try{
      const j = await this.panggil("muat");
      const server = j.data || {};
      this.gabung(server);
      const kirim = this.bedaKirim(server);
      const nisan = DB._meta.nisan.slice(-500);
      if(Object.keys(kirim).length || nisan.length){
        await this.panggil("simpan", {data:kirim, nisan:nisan});
        DB._meta.nisan = [];
      }
      DB._meta.sinkronTerakhir = skrg(); this.pesan = ""; simpanDB();
      this.perbarui();
      if(!diam){ roti("Data tersinkron.","ok"); buka(HAL); }
    }catch(e){
      this.pesan = e.message || String(e);
      this.perbarui("gagal");
      if(!diam) roti("Gagal sinkron: " + this.pesan, "salah");
    }finally{ this.sibuk = false; }
  }
};

    <div class="kartu"><div class="kartu-kop"><h3>PIN saya</h3></div>
      <div class="kartu-isi">
        <p style="color:var(--redup);font-size:13px;margin:0 0 10px">PIN adalah identitas Anda di aplikasi. Setiap catatan yang dibuat tercatat atas nama pemilik PIN.</p>
        <div class="baris">
          <div class="klm"><label>PIN baru (6 angka)</label><input id="pinBaru" inputmode="numeric" maxlength="6"></div>
          <div class="klm sempit"><label>&nbsp;</label><button class="tbl utama" onclick="gantiPin()">Simpan PIN</button></div>
        </div>
      </div></div>

    <div class="kartu"><div class="kartu-kop"><h3>Cadangan data</h3></div>
      <div class="kartu-isi">
        <p style="color:var(--redup);font-size:13px;margin:0 0 10px">Simpan berkas cadangan secara berkala, terutama sebelum mengganti perangkat atau membersihkan browser.</p>
        <div class="baris">
          <div class="klm sempit"><label>&nbsp;</label><button class="tbl" onclick="unduhCadangan()">Unduh cadangan</button></div>
          <div class="klm sempit"><label>&nbsp;</label><button class="tbl" onclick="$('#fileCadangan').click()">Pulihkan dari berkas</button></div>
          <input type="file" id="fileCadangan" accept="application/json" style="display:none" onchange="pulihkanCadangan(this)">
        </div>
        <div class="bantu" style="margin-top:8px">Ukuran data saat ini: ${ang((JSON.stringify(DB).length/1024/1024),2)} MB dari sekitar 5 MB kuota browser.</div>
      </div></div>

    <div class="kartu"><div class="kartu-kop"><h3>Tentang aplikasi</h3></div>
      <div class="kartu-isi">
        <table class="tab"><tbody>
          <tr><th>Versi</th><td>${VERSI}</td></tr>
          <tr><th>Pengguna</th><td>${esc(USER.nama)} — ${esc(PERAN[USER.peran].nama)}</td></tr>
          <tr><th>Jumlah catatan</th><td>${ang(TABEL.reduce((a,t)=>a+tabel(t).length,0))} baris</td></tr>
          <tr><th>Pemberi kerja</th><td>Konsorsium Eni – Timas IKPT</td></tr>
          <tr><th>Area</th><td>Pertamina Hulu Sanga Sanga, Muara Badak</td></tr>
        </tbody></table>
        <div class="baris" style="margin-top:12px">
          <div class="klm sempit"><label>&nbsp;</label><button class="tbl" onclick="keluar()">Keluar</button></div>
          ${pc? `<div class="klm sempit"><label>&nbsp;</label><button class="tbl bahaya" onclick="hapusSemua()">Hapus semua data</button></div>`:""}
        </div>
      </div></div>
  </div>`;
};
function simpanSambungan(){
  DB._meta.gasUrl = $("#setUrl").value.trim();
  DB._meta.gasToken = $("#setToken").value.trim();
  simpanDB(); Sync.perbarui(); roti("Sambungan tersimpan.","ok");
}
function gantiPin(){
  const v = ($("#pinBaru").value||"").replace(/\D/g,"");
  if(v.length!==6){ roti("PIN harus 6 angka.","salah"); return; }
  if(tabel("USERS").some(u=>String(u.pin)===v && u.id!==USER.id)){ roti("PIN sudah dipakai pengguna lain.","salah"); return; }
  tulis("USERS", {id:USER.id, pin:v}, "ganti PIN"); USER.pin = v;
  roti("PIN diperbarui.","ok"); $("#pinBaru").value = "";
}
function unduhCadangan(){ unduhTeks("cadangan_AEN_PHSS_" + hariIni() + ".json", JSON.stringify(DB), "application/json"); }
function pulihkanCadangan(inp){
  const f = inp.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const j = JSON.parse(fr.result);
      if(!j || !j.USERS) throw new Error("bukan berkas cadangan aplikasi ini");
      modal("Pulihkan data", `<div class="awas-kotak">Data di perangkat ini akan digabung dengan isi berkas cadangan. Catatan dengan id sama akan diperbarui.</div>`,
        [{teks:"Batal", aksi:tutupModal},{teks:"Gabungkan", kelas:"utama", aksi:()=>{
          Sync.gabung(j); simpanDB(); tutupModal(); roti("Cadangan digabungkan.","ok"); buka(HAL); }}]);
    }catch(e){ roti("Berkas tidak bisa dibaca: " + e.message,"salah"); }
  };
  fr.readAsText(f); inp.value = "";
}
function hapusSemua(){
  modal("Hapus semua data", `<div class="bahaya-kotak">Seluruh data di perangkat ini dihapus, termasuk foto. Unduh cadangan lebih dulu.</div>
    <div class="baris" style="margin-top:10px"><div class="klm"><label>Ketik HAPUS untuk melanjutkan</label><input id="konfirmHapus"></div></div>`,
    [{teks:"Batal", aksi:tutupModal},{teks:"Hapus", kelas:"bahaya", aksi:()=>{
      if($("#konfirmHapus").value.trim().toUpperCase()!=="HAPUS"){ roti("Ketik HAPUS untuk konfirmasi.","salah"); return; }
      localStorage.removeItem(KUNCI); localStorage.removeItem(KUNCI_SESI); location.reload(); }}]);
}

/* ===========================================================
   MULAI
   =========================================================== */
function pasangGambar(){
  $("#imgAenLogin").src = LOGO_AEN; $("#imgAenSisi").src = LOGO_AEN;
  $("#imgKonsorLogin").src = LOGO_KONSOR; $("#imgKonsorBar").src = LOGO_KONSOR;
  $("#cap-air").src = LOGO_AVINDO;
}
$("#btnDrawer").onclick = () => { DRAWER = !DRAWER; $("#sisi").classList.toggle("buka", DRAWER); };
$("#chipSync").onclick = panelSync;
$("#chipUser").onclick = () => {
  modal("Akun", `<table class="tab"><tbody>
      <tr><th>Nama</th><td>${esc(USER.nama)}</td></tr>
      <tr><th>Peran</th><td>${esc(PERAN[USER.peran].nama)}</td></tr>
      <tr><th>Hak input</th><td>${boleh("inputHarian")? "input data lapangan":"lihat saja"}${boleh("master")? ", master data & verifikasi":""}</td></tr>
    </tbody></table>`,
    [{teks:"Tutup", aksi:tutupModal},{teks:"Pengaturan", aksi:()=>{tutupModal(); buka("pengaturan");}},{teks:"Keluar", kelas:"bahaya", aksi:keluar}]);
};
document.addEventListener("keydown", e => { if(e.key==="Escape") tutupModal(); });

muatDB(); siapkanUsers(); P(); pasangGambar(); pasangLogin();
$("#sisiVersi").textContent = "Aplikasi " + VERSI;
if(sesiTersimpan()) masuk();
setInterval(()=>{ if(USER && Sync.aktif() && !Sync.sibuk) Sync.jalan(true); }, 60000);
</script>
</body>
</html>
